<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anatomy & Physiology — Interactive 3D Human Eye</title>
  <!-- Google model-viewer Web Component -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    :root {
      --primary: #0084ff;
      --primary-hover: #00b4ff;
      --bg-dark: #0f141c;
      --panel-bg: rgba(18, 25, 38, 0.92);
      --text-main: #f0f4f8;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* Header Bar */
    header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: linear-gradient(180deg, rgba(15, 20, 28, 0.9) 0%, rgba(15, 20, 28, 0) 100%);
      pointer-events: none;
    }

    .header-content {
      pointer-events: auto;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* 3D Model Viewer Canvas */
    model-viewer {
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-dark);
      --poster-color: transparent;
    }

    /* Hotspot Dot Styling */
    .Hotspot {
      background: var(--primary);
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 0 12px rgba(0, 132, 255, 0.8), 0 2px 6px rgba(0, 0, 0, 0.5);
      width: 22px;
      height: 22px;
      cursor: pointer;
      box-sizing: border-box;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.2s ease, box-shadow 0.2s ease;
      padding: 0;
      position: relative;
    }

    .Hotspot::after {
      content: "";
      position: absolute;
      top: -6px;
      left: -6px;
      right: -6px;
      bottom: -6px;
      border-radius: 50%;
      border: 1.5px solid var(--accent);
      opacity: 0.6;
      animation: pulse 2.2s infinite ease-out;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.8);
        opacity: 0.8;
      }
      70% {
        transform: scale(1.6);
        opacity: 0;
      }
      100% {
        transform: scale(1.6);
        opacity: 0;
      }
    }

    .Hotspot:hover {
      transform: scale(1.3);
      background: var(--primary-hover);
      box-shadow: 0 0 16px rgba(56, 189, 248, 1);
    }

    .Hotspot:focus {
      outline: none;
    }

    /* Hotspot Annotation Text Labels (Hidden by default, toggled to display: block) */
    .HotspotAnnotation {
      display: none; /* Required: hidden by default */
      position: absolute;
      bottom: calc(100% + 14px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel-bg);
      color: var(--text-main);
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 0.85rem;
      line-height: 1.45;
      width: 260px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 1px 1px rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      pointer-events: auto;
      z-index: 1000;
      text-align: left;
      cursor: default;
    }

    .HotspotAnnotation::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border-width: 7px;
      border-style: solid;
      border-color: rgba(18, 25, 38, 0.95) transparent transparent transparent;
    }

    .HotspotAnnotation h3 {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .HotspotAnnotation .tag {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .HotspotAnnotation p {
      color: #cbd5e1;
      font-size: 0.82rem;
    }

    /* Controls Instruction Pill */
    .instruction-pill {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 20, 28, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 8px 18px;
      border-radius: 20px;
      pointer-events: none;
      z-index: 5;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .instruction-pill span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* Anatomical Quick Navigation Bar */
    .nav-bar {
      position: absolute;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }

    .nav-btn {
      background: rgba(18, 25, 38, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .nav-btn:hover {
      background: rgba(0, 132, 255, 0.25);
      border-color: var(--primary);
      color: #ffffff;
      transform: translateX(-4px);
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="header-content">
      <h1>Anatomy of the Human Eye</h1>
      <div class="subtitle">Anatomy & Physiology Course Interactive 3D Dissection</div>
    </div>
  </header>

  <!-- 3D Model Viewer with Interactive Hotspots -->
  <model-viewer
    id="eyeViewer"
    src="human_eye.glb"
    alt="Interactive 3D Anatomical Human Eye Model"
    camera-controls
    touch-action="pan-y"
    exposure="1.0"
    shadow-intensity="1.2"
    camera-orbit="0deg 75deg 3.4m"
    min-camera-orbit="auto auto 1.4m"
    max-camera-orbit="auto auto 6.0m"
    field-of-view="35deg">

    <!-- 1. CORNEA HOTSPOT -->
    <button
      class="Hotspot"
      slot="hotspot-cornea"
      data-position="0m 0m 1.18m"
      data-normal="0m 0m 1m"
      data-visibility-attribute="visible"
      aria-label="Cornea">
      <div class="HotspotAnnotation">
        <h3>Cornea <span class="tag">Refractive</span></h3>
        <p>The transparent, convex anterior dome of the eye. It accounts for approximately two-thirds (40–44 diopters) of the eye's total optical power and focuses incoming light onto the retina.</p>
      </div>
    </button>

    <!-- 2. IRIS HOTSPOT -->
    <button
      class="Hotspot"
      slot="hotspot-iris"
      data-position="0.30m 0.30m 0.68m"
      data-normal="0.30m 0.30m 0.90m"
      data-visibility-attribute="visible"
      aria-label="Iris">
      <div class="HotspotAnnotation">
        <h3>Iris <span class="tag">Aperture</span></h3>
        <p>The pigmented circular muscular diaphragm that controls the amount of light entering the eye. Contains the sphincter and dilator pupillae muscles to adjust pupil diameter.</p>
      </div>
    </button>

    <!-- 3. PUPIL HOTSPOT -->
    <button
      class="Hotspot"
      slot="hotspot-pupil"
      data-position="0m 0m 0.65m"
      data-normal="0m 0m 1m"
      data-visibility-attribute="visible"
      aria-label="Pupil">
      <div class="HotspotAnnotation">
        <h3>Pupil <span class="tag">Aperture</span></h3>
        <p>The central aperture in the iris. It appears pitch black because almost all light entering is absorbed by internal vascular and retinal tissues inside the vitreous chamber.</p>
      </div>
    </button>

    <!-- 4. SCLERA HOTSPOT -->
    <button
      class="Hotspot"
      slot="hotspot-sclera"
      data-position="0.76m 0.54m 0.35m"
      data-normal="0.76m 0.54m 0.35m"
      data-visibility-attribute="visible"
      aria-label="Sclera">
      <div class="HotspotAnnotation">
        <h3>Sclera <span class="tag">Protective</span></h3>
        <p>The opaque, tough fibrous outer tunic ("white of the eye"). It maintains intraocular pressure, protects internal ocular structures, and provides insertion points for extraocular muscles.</p>
      </div>
    </button>

  </model-viewer>

  <!-- Side Navigation Bar for Anatomy Quick Jumps -->
  <aside class="nav-bar">
    <button class="nav-btn" onclick="focusHotspot('hotspot-cornea', '0deg 75deg 2.4m')">1. Cornea</button>
    <button class="nav-btn" onclick="focusHotspot('hotspot-iris', '25deg 70deg 2.2m')">2. Iris</button>
    <button class="nav-btn" onclick="focusHotspot('hotspot-pupil', '0deg 75deg 2.2m')">3. Pupil</button>
    <button class="nav-btn" onclick="focusHotspot('hotspot-sclera', '60deg 60deg 3.0m')">4. Sclera</button>
  </aside>

  <!-- Instructions Banner -->
  <div class="instruction-pill">
    <span>🖱️ Drag to rotate</span>
    <span>•</span>
    <span>🔍 Scroll to zoom</span>
    <span>•</span>
    <span>📍 Click hotspot dots for anatomy labels</span>
  </div>

  <!-- Interactive JavaScript: Toggle Annotations -->
  <script>
    const viewer = document.getElementById('eyeViewer');
    const hotspotButtons = document.querySelectorAll('.Hotspot');

    // Attach click listener to each hotspot button
    hotspotButtons.forEach(button => {
      button.addEventListener('click', (event) => {
        event.stopPropagation();
        const annotation = button.querySelector('.HotspotAnnotation');
        const isCurrentlyOpen = (annotation.style.display === 'block');

        // Hide all other hotspot annotations first
        document.querySelectorAll('.HotspotAnnotation').forEach(ann => {
          ann.style.display = 'none';
        });

        // Toggle the clicked annotation
        annotation.style.display = isCurrentlyOpen ? 'none' : 'block';
      });
    });

    // Clicking anywhere on the canvas or background dismisses open annotations
    viewer.addEventListener('click', () => {
      document.querySelectorAll('.HotspotAnnotation').forEach(ann => {
        ann.style.display = 'none';
      });
    });

    // Quick navigation helper to focus camera and open specific annotation
    function focusHotspot(slotName, orbit) {
      if (viewer && orbit) {
        viewer.cameraOrbit = orbit;
      }
      const targetButton = document.querySelector(`.Hotspot[slot="${slotName}"]`);
      if (targetButton) {
        // Close others
        document.querySelectorAll('.HotspotAnnotation').forEach(ann => {
          ann.style.display = 'none';
        });
        const annotation = targetButton.querySelector('.HotspotAnnotation');
        if (annotation) {
          annotation.style.display = 'block';
        }
      }
    }
  </script>
</body>
</html>
